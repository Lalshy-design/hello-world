<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hey, I'm Lisa</title>
  <meta name="description" content="Lisa — a designer learning to build with Claude Code.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0f8b8d;
      --teal-deep: #0a5f61;
      --teal-soft: #d7f0ef;
      --bg: #f6fbfa;
      --text: #12302f;
      --muted: #4a6665;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --teal: #3cc4c4;
        --teal-deep: #8ee3e1;
        --teal-soft: #123a3a;
        --bg: #0b1918;
        --text: #e6f4f3;
        --muted: #9dbcbb;
      }
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      background:
        radial-gradient(circle at 15% 10%, var(--teal-soft), transparent 45%),
        radial-gradient(circle at 90% 90%, var(--teal-soft), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .photo {
      width: 180px;
      height: 180px;
      margin: 0 auto 32px;
      border-radius: 50%;
      padding: 6px;
      background: var(--teal);
      box-shadow: 0 20px 50px -20px var(--teal);
    }
    .photo img,
    .photo .initial {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid var(--bg);
      object-fit: cover;
      display: block;
    }
    .photo .initial {
      display: grid;
      place-items: center;
      background: var(--teal-soft);
      color: var(--teal-deep);
      font-family: "Fraunces", Georgia, serif;
      font-size: 72px;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      line-height: 1.1;
      margin-bottom: 16px;
    }
    h1 span { color: var(--teal); }

    p {
      font-size: 1.125rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .swatch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: var(--teal-deep);
    }
    .swatch::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: var(--teal);
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--teal);
      color: #fff;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .button:hover { background: var(--teal-deep); transform: translateY(-2px); }
    .button:focus-visible { outline: 3px solid var(--teal-deep); outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      .button { color: #0b1918; }
    }
    .button svg { width: 18px; height: 18px; fill: currentColor; }
  </style>
</head>
<body>
  <main>
    <div class="photo">
      <!-- Drop a photo named photo.jpg next to this file -->
      <img src="photo.jpg" alt="Photo of Lisa"
           onerror="this.outerHTML='<div class=&quot;initial&quot; aria-hidden=&quot;true&quot;>L</div>'">
    </div>

    <h1>Hey! My name is <span>Lisa</span>.</h1>
    <p>I'm a designer learning to build with Claude Code.</p>
    <p>My favourite colour is <span class="swatch">teal</span></p>

    <!-- Replace with your LinkedIn profile URL -->
    <a class="button" href="https://www.linkedin.com/in/your-profile" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
      Check out my LinkedIn
    </a>
  </main>
</body>
</html>
